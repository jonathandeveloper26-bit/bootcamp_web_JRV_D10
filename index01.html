<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>'Day10: Task01'</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <header>
            <h1>Day 10: Task01</h1>
        </header>
        <main>
            <form id="form_input_name">
                <input type="text" id="name">
                <button type="submit">Send</button>
            </form>

        </main>
        <footer>

        </footer> 
        
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <script>
            const form_submission = document.querySelector("#form_input_name");
            const name_submitted = document.querySelector("#name");
            form_submission.addEventListener("submit", async(event) => {
                event.preventDefault();
                const url = `task01.php?name=${encodeURIComponent(name_submitted.value)}`;
                try {
                    const response = await fetch(url)
                    if(!response.ok) {
                        throw new Error(response.status);
                    }
                    const data = await response.json();
                    alert(data.name);
                }
                catch (error) {
                    alert("Error Occurred");
                    console.error(error);
                }
            });
        </script>
    </body>
</html>
