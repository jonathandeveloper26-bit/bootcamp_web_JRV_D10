<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>'Day10: Task02'</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <header>
            <h1>Day 10: Task02</h1>
        </header>
        <main>
            <form id="form_input_email" method="post">
                <input type="email" id="email" name="email">
                <button type="submit">Send</button>
            </form>

        </main>
        <footer>

        </footer> 
        
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <script>
            const form_submission = document.querySelector("#form_input_email");
            
            form_submission.addEventListener("submit", async(event) => {
                event.preventDefault();
                const email_submitted = new FormData (document.querySelector("#form_input_email"));
                try {
                    const response = await fetch("task02.php", {
                        method: "Post",
                        body: email_submitted,
                    })
                    
                    if (response.status === 200) {
                        alert("This email is valid.");
                    }

                    else if (response.status === 400) {
                        alert("This email is invalid");
                    }

                    else {
                        throw new Error(`An error has occured: ${response.status}`)
                    }
                }
                catch (error) {
                    alert("Error Occurred");
                    console.error(error);
                }
            });
        </script>
    </body>
</html>
