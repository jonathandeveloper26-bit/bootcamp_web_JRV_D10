<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>'Day10: Task03'</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <header>
            <h1>Day 10: Task03</h1>
        </header>
        <main>
            <table class="table">
                <thead>
                    <tr>
                        <th>country-code</th>
                        <th>name</th>
                    </tr>
                </thead>
                <tbody id="t_body"></tbody>
                <tfoot></tfoot>
            </table>
            <button id="load_data">load countries</button>

        </main>
        <footer>

        </footer> 
        
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <script>
            const load_data = document.querySelector("#load_data");
            const table_body = document.querySelector("#t_body");
            const load_button = document.querySelector("#load_data");
            
            load_data.addEventListener("click", async(event) => {
                const response = await fetch("./countries.json");
                if (response.ok) {
                    try {
                        const data = await response.json();
                        table_body.replaceChildren();
                        table_body.textContent = "";
                        for (const pair of Object.entries(data)) {
                            const row = document.createElement("tr");
                            const country_code_cell = document.createElement("td");
                            const country_name_cell = document.createElement("td");
                            country_code_cell.textContent = pair[0];
                            country_name_cell.textContent = pair[1];
                            row.append(country_code_cell);
                            row.append(country_name_cell);
                            table_body.append(row);
                        }
                    } catch {
                        alert("An Error has Occurred: " + response.status);
                    }
                    
                }
                else {
                    alert ("ERROR: " + response.status)
                }
                
            });
        </script>
    </body>
</html>
